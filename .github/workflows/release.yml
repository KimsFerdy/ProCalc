# Builds ProCalc for Windows and Linux and attaches everything to a GitHub release.
#
# Start it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab (Run workflow) with a tag name.
#
# The release is created as a draft; publish it once the files look right.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.create.outputs.version }}
      notes: ${{ steps.create.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          # "What's new" comes from .github/changes/<tag>.md when there is one; the app's
          # update dialog shows that section.
          {
            if [ -f ".github/changes/$TAG.md" ]; then
              echo "## What's new"; echo; cat ".github/changes/$TAG.md"; echo
            fi
            cat .github/release-notes.md
          } > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "ProCalc $version" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
          {
            echo "notes<<NOTES_EOF"; cat notes.md; echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "release_id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: ubuntu-22.04
            os: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Also signs every installer for the in-app updater and uploads latest.json, which
      # installed copies read to find new versions.
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: --config src-tauri/tauri.release.conf.json

      - name: Portable zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          $dir = "ProCalc_${env:VERSION}_windows_x64_portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/procalc.exe "$dir/ProCalc.exe"
          Copy-Item LICENSE, README.md $dir
          # Tells the app it's portable: it offers a download instead of running an installer.
          New-Item "$dir/portable" -ItemType File | Out-Null
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          gh release upload $env:TAG "$dir.zip" --clobber

      - name: Portable zip (Linux)
        if: matrix.os == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          dir="ProCalc_${VERSION}_linux_x64_portable"
          mkdir "$dir"
          cp target/release/procalc "$dir/procalc"
          chmod +x "$dir/procalc"
          cp LICENSE README.md "$dir/"
          touch "$dir/portable"
          zip -r "$dir.zip" "$dir"
          tar -czf "$dir.tar.gz" "$dir"
          gh release upload "$TAG" "$dir.zip" "$dir.tar.gz" --clobber

  # One APK for 64- and 32-bit ARM phones, signed with the same release key every time so each
  # new version installs over the last one (the app offers it from its update check).
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      - run: npm ci

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets are needed to sign the APK."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/procalc-android.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/procalc-android.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=procalc
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Upload the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          cp "$apk" "ProCalc_${VERSION}_android.apk"
          gh release upload "$TAG" "ProCalc_${VERSION}_android.apk" --clobber
